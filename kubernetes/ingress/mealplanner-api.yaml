apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mp-api-ingress
  namespace: mealplanner
spec:
  rules:
  - http:
      paths:
      - path: /api/
        pathType: Prefix
        backend:
          service:
            name: api
            port:
              number: 80
      - path: /swagger/
        pathType: Prefix
        backend:
          service:
            name: api
            port:
              number: 80