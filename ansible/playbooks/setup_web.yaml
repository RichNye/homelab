- name: Set up web servers
  hosts: web_servers
  remote_user: "{{ remote_user }}"
  become: yes

  tasks:
  - name: Install ASP.NET Core runtime
    ansible.builtin.apt:
      name:
        - aspnetcore-runtime-{{ dotnet_version }}
      state: present
      update_cache: yes

  - name: Create web application directory
    ansible.builtin.file:
      path: "{{ app_path }}"
      state: directory
      owner: "{{ remote_user }}"
      group: "{{ remote_user }}"
      mode: "0755"

  - name: Download mealplanner release
    amazon.aws.s3_object:
      mode: get
      access_key: "{{ r2_access_key_id }}"
      secret_key: "{{ r2_secret_access_key }}"
      bucket: "{{ r2_bucket }}"
      endpoint_url: "{{ r2_endpoint_url }}"
      object: "releases/{{ mealplanner_release }}.tar.gz"
      dest: "/tmp/{{ mealplanner_release }}.tar.gz"

  - name: Extract mealplanner release
    ansible.builtin.unarchive:
      src: "/tmp/{{ mealplanner_release }}.tar.gz"
      dest: "{{ app_path }}"
      remote_src: yes
      owner: "{{ remote_user }}"
      group: "{{ remote_user }}"
    notify:
      - set app_release environment variable
      - restart mealplannerapi

  - name: Create environment variable file
    ansible.builtin.copy:
      dest: "{{ app_path }}/.env"
      content: |
        ASPNETCORE_ENVIRONMENT="{{ app_environment }}"
      owner: "{{ remote_user }}"
      group: "{{ remote_user }}"
      mode: "0644"
    notify: restart mealplannerapi

  - name: Create systemd service file
    ansible.builtin.copy:
      dest: /etc/systemd/system/mealplannerapi.service
      content: |
        [Unit]
        Description=.NET Core Meal Planner API Service
        After=network.target

        [Service]
        User={{ remote_user }}
        EnvironmentFile={{ app_path }}/.env
        WorkingDirectory={{ app_path }}
        ExecStart=/usr/bin/dotnet {{ app_path }}/MealPlannerApi.dll
        Restart=always
        RestartSec=10
        KillSignal=SIGINT
        SyslogIdentifier=mealplannerapi

        [Install]
        WantedBy=multi-user.target
      mode: "0644"
    notify:
      - reload systemd
      - restart mealplannerapi

  - name: Enable and start MealPlanner API service
    ansible.builtin.systemd:
      name: mealplannerapi
      enabled: yes
      state: started

  handlers:
  - name: reload systemd
    ansible.builtin.systemd:
      daemon_reload: yes

  - name: restart mealplannerapi
    ansible.builtin.systemd:
      name: mealplannerapi
      state: restarted

  - name: set app_release environment variable
    ansible.builtin.lineinfile:
      path: /etc/environment
      regexp: '^APP_RELEASE='
      line: "APP_RELEASE={{ mealplanner_release }}"
      create: yes